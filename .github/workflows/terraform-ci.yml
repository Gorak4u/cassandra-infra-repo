name: Terraform CI

on:
  push:
    branches: ['**']
    paths:
      - 'terraform/**'
      - 'inventory/**'
      - 'user-data/**'
      - 'bin/**'
      - 'provision.sh'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'inventory/**'
      - 'user-data/**'
      - 'bin/**'
      - 'provision.sh'

jobs:
  # ---------------------------------------------------------------------------
  # Inventory checks -- run on every push, fast feedback
  # ---------------------------------------------------------------------------
  check-inventory:
    name: Inventory checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: install pyyaml
        run: pip install pyyaml
      - name: expand inventory (all customers)
        run: python3 bin/expand-inventory.py --format yaml > /dev/null
      # bin/check-ports.py and bin/check-sizing.py are deliberately NOT run
      # here. Both compare an infra value against the Hiera data that sets it,
      # so both need cassandra-control-repo checked out alongside this one.
      # That repo is private, and the built-in GITHUB_TOKEN is scoped to this
      # repository only -- so the steps could never pass on a runner, and the
      # job failed at check-ports on every run from the initial import onward.
      #
      # Run them where both halves of the estate are present:
      #
      #   check-ports.py    ports the firewall opens vs. the port the service binds
      #   check-sizing.py   machine shape vs. the JVM heap Hiera asks for
      #
      # Both honour PUPPET_CONTROL_REPO and default to ../cassandra-control-repo.
      - name: bash syntax (provision.sh + user-data fragments)
        run: |
          bash -n provision.sh
          for f in user-data/*.sh; do bash -n "$f"; done

  # ---------------------------------------------------------------------------
  # GCP Terraform -- validate + fmt
  # ---------------------------------------------------------------------------
  validate-gcp:
    name: Validate GCP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/gcp
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"
      - name: terraform init (no backend)
        run: terraform init -backend=false
      - name: terraform validate
        run: terraform validate
      - name: terraform fmt check
        run: terraform fmt -check -recursive

  # ---------------------------------------------------------------------------
  # AWS Terraform -- validate + fmt
  # ---------------------------------------------------------------------------
  validate-aws:
    name: Validate AWS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"
      - name: terraform init (no backend)
        run: terraform init -backend=false
      - name: terraform validate
        run: terraform validate
      - name: terraform fmt check
        run: terraform fmt -check -recursive

  # ---------------------------------------------------------------------------
  # GCP plan -- only on pull requests, uses dummy tfvars
  # ---------------------------------------------------------------------------
  plan-gcp:
    name: Plan GCP (dry-run)
    runs-on: ubuntu-latest
    needs: [validate-gcp, check-inventory]
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: terraform/gcp
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"
      - name: terraform init (no backend)
        run: terraform init -backend=false
      - name: create CI tfvars
        run: |
          cat > ci.auto.tfvars <<'EOF'
          project_id            = "ci-project"
          region                = "us-central1"
          zones                 = ["us-central1-a"]
          customer              = "amex"
          environment           = "nonprod"
          datacenter            = "dc_east"
          boot_image            = "ubuntu-os-cloud/ubuntu-2004-lts"
          network_name          = "ci-vpc"
          subnetwork_name       = "ci-subnet"
          service_account_email = "ci@ci-project.iam.gserviceaccount.com"
          EOF
      - name: terraform plan (validates resource graph)
        run: terraform plan -input=false 2>&1 | tail -20

  # ---------------------------------------------------------------------------
  # AWS plan -- only on pull requests, uses dummy tfvars
  # ---------------------------------------------------------------------------
  plan-aws:
    name: Plan AWS (dry-run)
    runs-on: ubuntu-latest
    needs: [validate-aws, check-inventory]
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: terraform/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"
      - name: terraform init (no backend)
        run: terraform init -backend=false
      - name: create CI tfvars
        run: |
          cat > ci.auto.tfvars <<'EOF'
          region               = "us-east-1"
          customer             = "amex"
          environment          = "nonprod"
          datacenter           = "dc_east"
          ami_id               = "ami-00000000000000000"
          vpc_id               = "vpc-00000000"
          subnet_ids           = ["subnet-00000001", "subnet-00000002"]
          security_group_ids   = ["sg-00000000"]
          iam_instance_profile = "ci-instance-profile"
          aws_endpoint_url     = "http://localhost:4566"
          EOF
      - name: terraform plan (validates resource graph)
        run: terraform plan -input=false 2>&1 | tail -20
