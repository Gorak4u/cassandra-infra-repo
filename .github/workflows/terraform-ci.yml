name: Terraform CI

on:
  push:
    branches: ['**']
    paths:
      - 'terraform/**'
      - 'inventory/**'
      - 'user-data/**'
      - 'bin/**'
      - 'provision.sh'
      # The workflow itself: without this, a change to CI does not run CI, so
      # a broken or newly added job is only discovered by the next unrelated
      # commit that happens to touch one of the paths above.
      - '.github/workflows/terraform-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'inventory/**'
      - 'user-data/**'
      - 'bin/**'
      - 'provision.sh'
      # The workflow itself: without this, a change to CI does not run CI, so
      # a broken or newly added job is only discovered by the next unrelated
      # commit that happens to touch one of the paths above.
      - '.github/workflows/terraform-ci.yml'

jobs:
  # ---------------------------------------------------------------------------
  # Inventory checks -- run on every push, fast feedback
  # ---------------------------------------------------------------------------
  check-inventory:
    name: Inventory checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: install pyyaml
        run: pip install pyyaml
      - name: expand inventory (all customers)
        run: python3 bin/expand-inventory.py --format yaml > /dev/null
      # bin/check-ports.py and bin/check-sizing.py are deliberately NOT run
      # here. Both compare an infra value against the Hiera data that sets it,
      # so both need cassandra-control-repo checked out alongside this one.
      # That repo is private, and the built-in GITHUB_TOKEN is scoped to this
      # repository only -- so the steps could never pass on a runner, and the
      # job failed at check-ports on every run from the initial import onward.
      #
      # Run them where both halves of the estate are present:
      #
      #   check-ports.py    ports the firewall opens vs. the port the service binds
      #   check-sizing.py   machine shape vs. the JVM heap Hiera asks for
      #
      # Both honour PUPPET_CONTROL_REPO and default to ../cassandra-control-repo.
      - name: bash syntax (provision.sh + user-data fragments)
        run: |
          bash -n provision.sh
          for f in user-data/*.sh; do bash -n "$f"; done

  # ---------------------------------------------------------------------------
  # GCP Terraform -- validate + fmt
  # ---------------------------------------------------------------------------
  validate-gcp:
    name: Validate GCP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/gcp
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"
      - name: terraform init (no backend)
        run: terraform init -backend=false
      - name: terraform validate
        run: terraform validate
      - name: terraform fmt check
        run: terraform fmt -check -recursive

  # ---------------------------------------------------------------------------
  # AWS Terraform -- validate + fmt
  # ---------------------------------------------------------------------------
  validate-aws:
    name: Validate AWS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"
      - name: terraform init (no backend)
        run: terraform init -backend=false
      - name: terraform validate
        run: terraform validate
      - name: terraform fmt check
        run: terraform fmt -check -recursive

  # ---------------------------------------------------------------------------
  # GCP plan -- dummy tfvars, no credentials, no state
  # ---------------------------------------------------------------------------
  plan-gcp:
    name: Plan GCP (dry-run)
    runs-on: ubuntu-latest
    needs: [validate-gcp, check-inventory]
    defaults:
      run:
        working-directory: terraform/gcp
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"
      - name: terraform init (no backend)
        run: terraform init -backend=false
      - name: create CI tfvars
        run: |
          cat > ci.auto.tfvars <<'EOF'
          project_id            = "ci-project"
          region                = "us-central1"
          zones                 = ["us-central1-a"]
          customer              = "amex"
          environment           = "nonprod"
          datacenter            = "dc_east"
          boot_image            = "ubuntu-os-cloud/ubuntu-2004-lts"
          network_name          = "ci-vpc"
          subnetwork_name       = "ci-subnet"
          service_account_email = "ci@ci-project.iam.gserviceaccount.com"
          EOF
      - name: terraform plan (validates resource graph)
        run: terraform plan -input=false 2>&1 | tail -20

  # ---------------------------------------------------------------------------
  # AWS plan -- BRING-YOUR-OWN-NETWORK shape (create_vpc = false)
  # ---------------------------------------------------------------------------
  plan-aws:
    name: Plan AWS (dry-run)
    runs-on: ubuntu-latest
    needs: [validate-aws, check-inventory]
    defaults:
      run:
        working-directory: terraform/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"
      - name: terraform init (no backend)
        run: terraform init -backend=false
      - name: create CI tfvars
        run: |
          cat > ci.auto.tfvars <<'EOF'
          region               = "us-east-1"
          customer             = "amex"
          environment          = "nonprod"
          datacenter           = "dc_east"
          ami_id               = "ami-00000000000000000"
          vpc_id               = "vpc-00000000"
          subnet_ids           = ["subnet-00000001", "subnet-00000002"]
          security_group_ids   = ["sg-00000000"]
          iam_instance_profile = "ci-instance-profile"
          aws_endpoint_url     = "http://localhost:4566"
          EOF
      - name: terraform plan (validates resource graph)
        run: terraform plan -input=false 2>&1 | tail -20

  # ---------------------------------------------------------------------------
  # AWS plan -- MANAGED-NETWORK shape (create_vpc = true)
  # ---------------------------------------------------------------------------
  # A SECOND shape, not a duplicate. plan-aws above runs with create_vpc =
  # false, which is the variable's default and skips vpc.tf, the NAT gateway,
  # the route tables, dns.tf and the per-AZ subnet lookup entirely -- count = 0
  # on all of it. Every estate built from this repo so far has used
  # create_vpc = true, so the half of the module that actually runs in anger
  # was the half CI never planned.
  #
  # What only this shape reaches:
  #   - aws_route53_zone.private and the per-node A record in dns.tf
  #   - local.subnet_by_az, and the "AZ-NOT-IN-THIS-VPC" sentinel precondition
  #     for a cluster naming an availability zone the VPC has no subnet in
  #   - aws_instance.node's depends_on the route table association
  #   - the IAM role, instance profile and the deploy-key policy, which
  #     create_iam_role = true builds and the other shape supplies externally
  #
  # The deploy-key ARN is a syntactically valid dummy on purpose: it satisfies
  # the precondition added in 8ad58a3, so that check is exercised in its
  # PASSING direction rather than only asserted to exist.
  plan-aws-vpc:
    name: Plan AWS (managed network)
    runs-on: ubuntu-latest
    needs: [validate-aws, check-inventory]
    defaults:
      run:
        working-directory: terraform/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"
      - name: terraform init (no backend)
        run: terraform init -backend=false
      - name: create CI tfvars
        run: |
          cat > ci.auto.tfvars <<'EOF'
          region             = "us-east-1"
          customer           = "amex"
          environment        = "nonprod"
          datacenter         = "dc_east"
          ami_id             = "ami-00000000000000000"

          create_vpc         = true
          create_dns_zone    = true
          create_iam_role    = true
          availability_zones = ["us-east-1a", "us-east-1b", "us-east-1c"]

          control_repo_deploy_key_secret_arn = "arn:aws:secretsmanager:us-east-1:000000000000:secret:ci-deploy-key-000000"
          join_secret_arn                    = "arn:aws:secretsmanager:us-east-1:000000000000:secret:ci-join-secret-000000"
          EOF
      - name: terraform plan (validates resource graph + preconditions)
        run: terraform plan -input=false 2>&1 | tail -30
